---
# Checks a release build's archives before anything is published. dist
# runs it after the per-target builds, on release gates and tags alike, and
# `host` waits for it. dist passes every custom job the plan.
name: Check artifacts

on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true

permissions:
  contents: read

jobs:
  linkage:
    name: Check Linux linkage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: artifacts-*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true

      - name: Check linkage
        run: .github/scripts/check-linkage.sh "$RUNNER_TEMP/artifacts"
