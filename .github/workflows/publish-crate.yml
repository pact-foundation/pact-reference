---
name: Publish crate

on:
  workflow_call:
    inputs:
      plan:
        description: dist plan JSON; its announcement tag names the crate
        type: string
        default: ''
      tag:
        description: Release tag `<crate>-v<version>`, when not called by dist
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Resolve crate and version
        id: crate
        env:
          PLAN: ${{ inputs.plan }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [[ -n "$PLAN" ]]; then
            tag=$(jq -r '.announcement_tag' <<<"$PLAN")
          else
            tag=$TAG_INPUT
          fi
          {
            echo "tag=$tag"
            echo "name=${tag%-v*}"
            echo "version=${tag##*-v}"
          } >> "$GITHUB_OUTPUT"

      # A re-run after a later step failed must not fail on "already exists".
      - name: Check whether this version is already published
        id: published
        env:
          NAME: ${{ steps.crate.outputs.name }}
          VERSION: ${{ steps.crate.outputs.version }}
        run: |
          path="${NAME:0:2}/${NAME:2:2}/${NAME}"
          if curl -fsS "https://index.crates.io/${path}" | jq -e --arg v "$VERSION" 'select(.vers == $v)' >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME} ${VERSION} is already on crates.io; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.published.outputs.exists == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.crate.outputs.tag }}

      - name: Install Rust
        if: steps.published.outputs.exists == 'false'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          build-warnings: warn
          cache: false

      - name: Authenticate with crates.io
        if: steps.published.outputs.exists == 'false' && vars.PUBLISH_DRY_RUN != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      # Set the repository variable PUBLISH_DRY_RUN=true on a fork to
      # rehearse releases without publishing.
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          NAME: ${{ steps.crate.outputs.name }}
          DRY_RUN: ${{ vars.PUBLISH_DRY_RUN }}
        run: |
          args=(--manifest-path rust/Cargo.toml -p "$NAME" --locked)
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          cargo publish "${args[@]}"
