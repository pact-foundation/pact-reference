---
name: Publish containers

on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: pact_verifier_cli version, without `v` (e.g. 1.3.6)
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push pact-verifier images
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        env:
          PLAN: ${{ inputs.plan }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$PLAN" ]]; then
            tag=$(jq -r '.announcement_tag' <<<"$PLAN")
          else
            tag="pact_verifier_cli-v$MANUAL_VERSION"
          fi
          if [[ "$tag" == pact_verifier_cli-v* ]]; then
            echo "version=${tag##*-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.version.outputs.version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        if: steps.version.outputs.version != ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Buildx
        if: steps.version.outputs.version != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Docker Hub
        if: steps.version.outputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GHCR
        if: steps.version.outputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.version.outputs.version != ''
        working-directory: rust/pact_verifier_cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" \
            --tag "pactfoundation/pact-verifier:$VERSION" \
            --tag pactfoundation/pact-verifier:latest \
            --tag "ghcr.io/pact-foundation/pact-verifier:$VERSION" \
            --tag ghcr.io/pact-foundation/pact-verifier:latest \
            --push
