# Steps dist runs before `dist build` in each per-target build job.

# musl builds run cargo through dist-cargo.sh, which links pact_ffi's musl
# CRT dynamically and keeps the cross-rs toolchain in charge of aarch64.
# dist checks for cargo-zigbuild before an aarch64-musl build; the stub
# satisfies that check and forwards to the same script. The cross-rs
# images lack xz, which dist's installer needs.
- name: Route musl builds through dist-cargo.sh
  if: contains(join(matrix.targets, ','), 'musl')
  shell: bash
  run: |
    command -v xz >/dev/null || { apt-get update -q && apt-get install -y -q --no-install-recommends xz-utils; }
    script="$GITHUB_WORKSPACE/.github/scripts/dist-cargo.sh"
    bin="$RUNNER_TEMP/dist-cargo-bin"
    mkdir -p "$bin"
    printf '#!/bin/sh\nexec "%s" "$@"\n' "$script" > "$bin/cargo-zigbuild"
    chmod +x "$bin/cargo-zigbuild"
    echo "$bin" >> "$GITHUB_PATH"
    echo "CARGO=$script" >> "$GITHUB_ENV"

# Windows builds run cargo through dist-cargo.sh, which adds pact_ffi's
# import library to the archive. dist runs `CARGO` as a Windows program,
# so a .cmd shim starts the script under Git for Windows' bash launcher;
# the launcher puts the MSYS tools on PATH.
- name: Route Windows builds through dist-cargo.sh
  if: contains(join(matrix.targets, ','), 'windows')
  shell: bash
  run: |
    git_root=$(cygpath -w /)
    script=$(cygpath -m "$GITHUB_WORKSPACE/.github/scripts/dist-cargo.sh")
    shim=$(cygpath -w "$RUNNER_TEMP/dist-cargo.cmd")
    printf '@"%s\\bin\\bash.exe" "%s" %%*\r\n' "${git_root%\\}" "$script" > "$shim"
    echo "CARGO=$shim" >> "$GITHUB_ENV"
