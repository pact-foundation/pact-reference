[package]
name = "pact_verifier"
version = "1.4.8"
authors = ["Ronald Holshausen <ronald.holshausen@gmail.com>"]
edition = "2024"
description = "Pact-Rust support library that implements provider verification functions"
documentation = "https://docs.rs/pact_verifier/"
homepage = "https://www.pact.io"
repository = "https://github.com/pact-foundation/pact-reference/blob/master/rust/pact_verifier"
readme = "README.md"
keywords = ["testing", "pact", "cdc"]
license = "MIT"
exclude = [
    "*.iml"
]

[features]
default = ["datetime", "xml", "plugins", "multipart"]
datetime = ["pact_models/datetime", "pact-plugin-driver?/datetime", "pact_matching/datetime"] # Support for date/time matchers and expressions
xml = ["pact_models/xml", "pact-plugin-driver?/xml", "pact_matching/xml"] # support for matching XML documents
plugins = ["dep:pact-plugin-driver", "dep:uuid", "pact_matching/plugins", "pact-plugin-driver/default"]
multipart = ["pact_matching/multipart"] # suport for MIME multipart bodies

[dependencies]
ansi_term = "0.12.1"
anyhow = "1.0.104"
async-trait = "0.1.91"
base64 = "0.23.0"
bytes = "1.12.1"
difference = "2.0.0"
futures = "0.3.33"
http = "1.5.0"
humantime = "2.4.0"
itertools = "0.15.0"
lazy_static = "1.5.0"
maplit = "1.0.2"
mime = "0.3.17"
pact_matching = { version = "~2.0.10", path = "../pact_matching", default-features = false }
pact_models = { version = "~1.3.14", default-features = false }
pact-plugin-driver = { version = "~1.2.2", optional = true, default-features = false }
uuid = { version = "1.24.0", features = ["v4"], optional = true }
regex = "1.13.1"
httpdate = "1.0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "blocking", "json", "query"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "tls12", "std"] }
serde = "1.0.229"
serde_json = "1.0.151"
serde_with = { version = "3.21.0", features = ["json"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-core = "0.1.36"
url = "2.5.8"
urlencoding = "2.1.3"

[lib]
crate-type = ["rlib"]

[dev-dependencies]
axum = "0.8.9"
chrono = "0.4.45"
chrono-tz = "0.10.4"
env_logger = "0.11.11"
expectest = "0.12.0"
pact_consumer = { version = "~1.4.10", path = "../pact_consumer" }
pretty_assertions = "1.4.1"
quickcheck = "1.1.0"
insta = "1.48.0"
rstest = "0.26.1"
test-log = { version = "0.2.21", features = ["trace"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "tracing-log", "fmt"] }
