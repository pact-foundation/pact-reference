[package]
name = "pact_matching"
version = "2.0.12"
authors = ["Ronald Holshausen <ronald.holshausen@gmail.com>"]
edition = "2024"
description = "Pact-Rust support library that implements request and response matching logic"
documentation = "https://docs.rs/pact_matching/"
homepage = "https://www.pact.io"
repository = "https://github.com/pact-foundation/pact-reference/blob/master/rust/pact_matching"
readme = "README.md"
keywords = ["testing", "pact", "cdc"]
license = "MIT"
exclude = [
    "*.iml"
]

[features]
default = ["datetime", "xml", "plugins", "multipart", "form_urlencoded"]
datetime = ["pact_models/datetime", "pact-plugin-driver?/datetime", "dep:chrono"] # Support for date/time matchers and expressions
xml = ["pact_models/xml", "pact-plugin-driver?/xml", "dep:sxd-document", "dep:kiss_xml"] # support for matching XML documents
plugins = ["dep:pact-plugin-driver"]
multipart = ["dep:multer"] # suport for MIME multipart bodies
form_urlencoded = ["pact_models/form_urlencoded"] # suport for matching form urlencoded

[dependencies]
ansi_term = "0.12.1"
anyhow = "1.0.104"
async-trait = "0.1.91"
base64 = "0.22.1"
bytes = { version = "1.12.1", features = ["serde"] }
chrono = { version = "0.4.45", features = ["std", "clock"], default-features = false, optional = true }
difference = "2.0.0"
futures = "0.3.33"
hex = "0.4.3"
http = "1.5.0"
infer = "0.22.0"
itertools = "0.15.0"
kiss_xml = { version = "1.1.0", optional = true }
lazy_static = "1.5.0"
lenient_semver = "0.4.2"
maplit = "1.0.2"
md5 = "0.8.1"
mime = "0.3.17"
multer = { version = "3.1.0", features = ["all"], optional = true }
nom = "7.1.3"
pact_models = { version = "~1.3.14", default-features = false }
rand = "0.9.5"
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_urlencoded = "0.7.1"
sxd-document = { version = "0.3.2", optional = true }
tracing = "0.1.44"
tracing-core = "0.1.36"
tree_magic_mini = "3.2.2"
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
onig = { version = "6.5.1", default-features = false }
pact-plugin-driver = { version = "~1.2.3", optional = true, default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.43", default-features = false }
tokio = { version = "1.49.0", features = ["full"] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1.49.0", features = ["rt"] }

[dev-dependencies]
quickcheck = "1"
expectest = "0.12.0"
env_logger = "0.11.11"
googletest = "0.14.3"
hamcrest2 = "0.3.0"
test-log = { version = "0.2.21", features = ["trace"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "tracing-log", "fmt"] }
ntest = "0.9.5"
pretty_assertions = "1.4.1"
rstest = "0.26.1"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "v2_engine"
harness = false
