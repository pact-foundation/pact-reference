[workspace]
members = ["cargo:rust"]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = []
dist = false
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]
# Link the MSVC runtime dynamically, as releases always have; consumers of
# the static library build against the same runtime.
msvc-crt-static = false
# Build each crate in its own cargo invocation: pact_ffi and the CLI need
# different musl CRT linkage (see .github/scripts/dist-cargo.sh).
precise-builds = true
# The release workflow carries hand edits for what dist has no setting
# for; see the comments marked `hand edit` in .github/workflows/release.yml.
allow-dirty = ["ci"]
pr-run-mode = "upload"
# The GitHub release follows the crates.io publish, so a failed publish
# leaves no release behind.
github-release = "announce"
global-artifacts-jobs = ["./check-artifacts"]
publish-jobs = ["./publish-crate"]
post-announce-jobs = ["./legacy-artifacts", "./publish-containers", "./release-title"]
github-build-setup = "../build-setup.yml"

[dist.github-custom-job-permissions]
check-artifacts = { contents = "read" }
publish-crate = { contents = "read", id-token = "write" }
legacy-artifacts = { contents = "write" }
publish-containers = { contents = "read", packages = "write" }
release-title = { contents = "write" }

[dist.github-custom-runners]
x86_64-apple-darwin = "macos-15-intel"
aarch64-apple-darwin = "macos-15"
# dist would cross-compile this with cargo-xwin on Linux; releases have
# always built it with MSVC on Windows.
aarch64-pc-windows-msvc = "windows-2022"

# Linux builds run in containers to fix what the libraries link against:
# - gnu: manylinux_2_28 (AlmaLinux 8) sets a glibc 2.28 floor, the oldest
#   glibc among supported major distributions (RHEL 8 and its rebuilds).
# - musl: cross-rs's musl toolchains on x64 runners. Built on a glibc host,
#   a musl cdylib would link glibc; and GitHub's JavaScript actions have no
#   Alpine Node for arm64 runners.
[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-24.04"
container.image = "quay.io/pypa/manylinux_2_28_x86_64:2026.10.10-1@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae"
container.host = "x86_64-unknown-linux-gnu"

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-24.04-arm"
container.image = "quay.io/pypa/manylinux_2_28_aarch64:2026.10.10-1@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6"
container.host = "aarch64-unknown-linux-gnu"

[dist.github-custom-runners.x86_64-unknown-linux-musl]
runner = "ubuntu-24.04"
container.image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl@sha256:0e3f9c34e663a9985ea26f569ec1f886334ce805dd6c7d72177e52f7b324ecac"
container.host = "x86_64-unknown-linux-gnu"

[dist.github-custom-runners.aarch64-unknown-linux-musl]
runner = "ubuntu-24.04"
container.image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl@sha256:4c29b5c7d0baf7d069dc48f0187f02c35e7a9df6f0f6a2b528400c6addb6a0cb"
container.host = "x86_64-unknown-linux-gnu"

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"  # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"  # v8.0.2
"swatinem/rust-cache" = "6323deb102c322ba6fcbdcafc7e3dddab59af2b6"  # v2.9.2
